[project]
name = "tradesensei-backend"
version = "1.16.1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.1,<5",
    "python-multipart>=0.0.22",
    "openpyxl>=3.1.5",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
    "itsdangerous>=2.2.0",
    "boto3>=1.43.1",
    "boto3-stubs>=1.43.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.8",
    "types-python-jose>=3.5.0.20250531",
    "types-openpyxl>=3.1.5.20250919",
]

[tool.ruff]
target-version = "py312"
line-length = 160
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live database (deselect with -m 'not integration')",
    "unit: marks fast unit tests with no external dependencies",
    "slow: marks tests that are too slow for CI (run locally with -m slow)",
]

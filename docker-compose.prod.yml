name: tradesensei-prod

# Production-like stack with Nginx reverse proxy.
# All secrets are injected via environment variables — no secrets in images.
#
# Required environment variables (set in shell or .env.prod — never commit):
#   DATABASE_URL
#   SECRET_KEY
#   CORS_ORIGINS
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down

services:
  # ─────────────────────────────────────────────
  # Postgre SQL
  # ─────────────────────────────────────────────
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-tradesensei}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-tradesensei}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-owner}/tradesensei-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tradesensei.example.com}
      # Object storage for screenshots and trade images.
      # Supports any S3-compatible provider (AWS S3, Cloudflare R2, Hetzner, Backblaze B2,
      # or bundled SeaweedFS via --profile storage). See docs/dev-guide.md for setup.
      # IMPORTANT: STORAGE_PUBLIC_URL must be browser-reachable (not a Docker-internal hostname).
      STORAGE_BACKEND: "${STORAGE_BACKEND:-}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-}"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-}"
      STORAGE_ENDPOINT_URL: "${STORAGE_ENDPOINT_URL:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ─────────────────────────────────────────────
  # Next.js Frontend (added in Iteration 5)
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-owner}/tradesensei-frontend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.tradesensei.example.com}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - frontend

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    # Note: when using --profile storage (SeaweedFS), add a proxy_pass for /storage/ → http://seaweedfs:8333
    # in nginx.conf so presigned URLs are browser-reachable. See docs/dev-guide.md for the config snippet.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - internal
      - external

  # ─────────────────────────────────────────────
  # SeaweedFS (S3-compatible object storage, optional)
  # Start with: docker compose -f docker-compose.prod.yml --profile storage up -d
  # ─────────────────────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:4.23
    profiles: [storage]
    restart: always
    environment:
      - WEED_JWT_FILER_SIGNING_KEY=${WEED_JWT_FILER_SIGNING_KEY:-7a8f9c1b2d3e4f5a6b7c8d9e0f1a2b3c}
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/security.json -dir=/data
    volumes:
      - seaweedfs_data:/data
      - ./security.json:/etc/seaweedfs/security.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  storage-init:
    image: amazon/aws-cli:latest
    profiles: [storage]
    restart: on-failure
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://tradesensei --region us-east-1 || true
      "
    networks:
      - internal

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  db_data:
  seaweedfs_data:

name: tradesensei

# Local development stack
# Usage:
#   docker compose up -d          — start all services
#   docker compose down           — stop all services
#   docker compose down -v        — stop and delete volumes (reset DB)
#   docker compose logs -f        — follow all logs

services:
  # ─────────────────────────────────────────────
  # TimescaleDB (PostgreSQL with time-series extension)
  # ─────────────────────────────────────────────
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradesensei
      POSTGRES_PASSWORD: tradesensei
      POSTGRES_DB: tradesensei
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesensei -d tradesensei"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      DB_USER: tradesensei
      DB_PASSWORD: tradesensei
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tradesensei
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      MCP_ENABLED: "true"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-}"
      OIDC_CONFIGURATION_URL: "${OIDC_CONFIGURATION_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      # Set to true to hide the username/password form (requires Google or OIDC to be configured).
      LOCAL_AUTH_DISABLED: "${LOCAL_AUTH_DISABLED:-false}"
      # Email / SMTP (for password reset). All fields must be set for password reset to work.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      BROKER_ENCRYPTION_KEY: "${BROKER_ENCRYPTION_KEY:-daJEwBPiYPyToA8tPYgcN9IZqaZpJFUCOjIgA6FbWl4=}"
      MARKET_DATA_HUB_URL: "${MARKET_DATA_HUB_URL:-}"
      # S3-compatible storage for trade image uploads and check-in screenshots.
      # By default, this connects to the bundled SeaweedFS instance.
      # Presigned URLs use seaweedfs:8333 (internal Docker hostname) so the
      # Next.js storage-proxy can reach SeaweedFS server-side. The browser
      # never contacts SeaweedFS directly — all uploads/downloads go through
      # the /api/storage-proxy Next.js route.
      STORAGE_BACKEND: "${STORAGE_BACKEND:-s3}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-tradesensei}"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-http://seaweedfs:8333}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-any}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-any}"
      STORAGE_ENDPOINT_URL: "${STORAGE_ENDPOINT_URL:-http://seaweedfs:8333}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10


  # ─────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      MARKET_DATA_HUB_URL: "${MARKET_DATA_HUB_URL:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # SeaweedFS (S3-compatible object storage)
  # ─────────────────────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:4.23
    restart: unless-stopped
    environment:
      - WEED_JWT_FILER_SIGNING_KEY=${WEED_JWT_FILER_SIGNING_KEY:-7a8f9c1b2d3e4f5a6b7c8d9e0f1a2b3c}
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/security.json -dir=/data
    # No ports exposed — storage is internal only.
    # Access goes through the Next.js /api/storage-proxy route.
    # expose: keeps the ports reachable within the Docker network.
    expose:
      - "8333"
      - "8888"
      - "9333"
    volumes:
      - seaweedfs_data:/data
      - ./security.json:/etc/seaweedfs/security.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-init:
    image: amazon/aws-cli:latest
    restart: on-failure
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://seaweedfs:8333 s3 ls > /dev/null 2>&1; do
          echo 'Waiting for SeaweedFS S3 API...';
          sleep 2;
        done;
        aws --endpoint-url http://seaweedfs:8333 s3 ls s3://tradesensei > /dev/null 2>&1 || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://tradesensei --region us-east-1;
      "

volumes:
  db_data:
  backend_venv:
  frontend_node_modules:
  seaweedfs_data:
name: tradejournal

# Local development stack
# Usage:
#   docker compose up -d          — start all services
#   docker compose down           — stop all services
#   docker compose down -v        — stop and delete volumes (reset DB)
#   docker compose logs -f        — follow all logs

services:
  # ─────────────────────────────────────────────
  # TimescaleDB (PostgreSQL with time-series extension)
  # ─────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradejournal
      POSTGRES_PASSWORD: tradejournal
      POSTGRES_DB: tradejournal
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradejournal -d tradejournal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://tradejournal:tradejournal@db:5432/tradejournal
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Next.js Frontend (placeholder — added in Iteration 5)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - frontend  # opt-in: docker compose --profile frontend up

volumes:
  db_data:
  frontend_node_modules:

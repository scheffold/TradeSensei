name: tradesensei

# Local development stack
# Usage:
#   docker compose up -d          — start all services
#   docker compose down           — stop all services
#   docker compose down -v        — stop and delete volumes (reset DB)
#   docker compose logs -f        — follow all logs

services:
  # ─────────────────────────────────────────────
  # TimescaleDB (PostgreSQL with time-series extension)
  # ─────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradesensei
      POSTGRES_PASSWORD: tradesensei
      POSTGRES_DB: tradesensei
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesensei -d tradesensei"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      DB_USER: tradesensei
      DB_PASSWORD: tradesensei
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tradesensei
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-}"
      OIDC_CONFIGURATION_URL: "${OIDC_CONFIGURATION_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      # Set to true to hide the username/password form (requires Google or OIDC to be configured).
      LOCAL_AUTH_DISABLED: "${LOCAL_AUTH_DISABLED:-false}"
      BROKER_ENCRYPTION_KEY: "${BROKER_ENCRYPTION_KEY:-daJEwBPiYPyToA8tPYgcN9IZqaZpJFUCOjIgA6FbWl4=}"
      MARKET_DATA_HUB_URL: "${MARKET_DATA_HUB_URL:-}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      MARKET_DATA_HUB_URL: "${MARKET_DATA_HUB_URL:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_venv:
  frontend_node_modules:

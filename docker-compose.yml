name: tradejournal

# Local development stack
# Usage:
#   docker compose up -d          — start all services
#   docker compose down           — stop all services
#   docker compose down -v        — stop and delete volumes (reset DB)
#   docker compose logs -f        — follow all logs

services:
  # ─────────────────────────────────────────────
  # TimescaleDB (PostgreSQL with time-series extension)
  # ─────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradejournal
      POSTGRES_PASSWORD: tradejournal
      POSTGRES_DB: tradejournal
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradejournal -d tradejournal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      DB_USER: tradejournal
      DB_PASSWORD: tradejournal
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tradejournal
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}"
      BROKER_ENCRYPTION_KEY: "${BROKER_ENCRYPTION_KEY:-daJEwBPiYPyToA8tPYgcN9IZqaZpJFUCOjIgA6FbWl4=}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Next.js Frontend (placeholder — added in Iteration 5)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-nextauth-secret-change-in-production}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_venv:
  frontend_node_modules:

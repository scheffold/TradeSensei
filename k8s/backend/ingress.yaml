apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: tradesensei
  labels:
    app.kubernetes.io/name: tradesensei-backend
    app.kubernetes.io/component: backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.tradesensei.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
  tls:
    - hosts:
        - api.tradesensei.example.com
      secretName: tls-backend

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: tradejournal
  labels:
    app.kubernetes.io/name: tradejournal-frontend
    app.kubernetes.io/component: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: tradejournal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
  tls:
    - hosts:
        - tradejournal.example.com
      secretName: tls-frontend

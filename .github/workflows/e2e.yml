name: E2E Tests (Playwright)

# Runs only after CI (lint + typecheck + unit tests) succeeds on main.
# This prevents running expensive E2E tests on broken builds.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Playwright E2E
    # Only run if the triggering CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node / npm ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ── Playwright browsers ─────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Start full stack via Docker Compose ─────────────────────────────────
      - name: Start Docker stack (db + backend + frontend)
        run: docker compose up -d --wait
        env:
          COMPOSE_HTTP_TIMEOUT: 120

      # ── Health checks ───────────────────────────────────────────────────────
      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend at http://localhost:8000/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is up."
              break
            fi
            echo "  Attempt $i/30 — waiting 5s..."
            sleep 5
          done
          curl -sf http://localhost:8000/health || (echo "Backend health check failed." && exit 1)

      - name: Wait for frontend to be healthy
        run: |
          echo "Waiting for frontend at http://localhost:3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is up."
              break
            fi
            echo "  Attempt $i/30 — waiting 5s..."
            sleep 5
          done
          curl -sf http://localhost:3000 || (echo "Frontend health check failed." && exit 1)

      # ── Run Playwright E2E tests ─────────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          CI: true

      # ── Teardown ─────────────────────────────────────────────────────────────
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

      # ── Upload test report ───────────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

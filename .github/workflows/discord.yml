name: Discord Release Notification
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to send notification for"
        required: true
        type: string

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # On real release events: use event payload directly.
      - name: GitHub Releases to Discord (release event)
        if: github.event_name == 'release'
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "TradeSensei Release Bot"
          release_name: ${{ github.event.release.name }}
          avatar_url: "https://cdn.discordapp.com/avatars/487431320314576937/bd64361e4ba6313d561d54e78c9e7171.png"
          content: "||@everyone||"
          footer_title: "Changelog"
          reduce_headings: true

      # On workflow_dispatch: fetch release data via API and pass explicitly.
      - name: Fetch release data
        if: github.event_name == 'workflow_dispatch'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          gh release view "$TAG" --json body --jq '.body' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "name=$(gh release view "$TAG" --json name --jq '.name')" >> $GITHUB_OUTPUT
          echo "url=$(gh release view "$TAG" --json url --jq '.url')" >> $GITHUB_OUTPUT

      - name: GitHub Releases to Discord (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Release Changelog"
          avatar_url: "https://cdn.discordapp.com/avatars/487431320314576937/bd64361e4ba6313d561d54e78c9e7171.png"
          content: "||@everyone||"
          footer_title: "Changelog"
          reduce_headings: true
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
